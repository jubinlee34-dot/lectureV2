name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          # package.json "packageManager" pins pnpm@10.4.1 — keep this in sync with it.
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 24 is the current Active LTS and matches devDependencies "@types/node": "^24.7.0".
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run check

      - name: Build
        run: pnpm run build
